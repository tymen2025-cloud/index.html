<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода (Open-Meteo)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .city { font-size: 22px; margin-bottom: 10px; opacity: 0.8; }
        .temp { font-size: 64px; font-weight: bold; margin: 10px 0; }
        .description { font-size: 18px; margin-bottom: 20px; text-transform: capitalize; }
        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        .val { font-weight: bold; display: block; font-size: 16px; }
    </style>
</head>
<body>

<div class="card">
    <div class="city">Моя локация</div>
    <div class="temp" id="temp">--°C</div>
    <div class="description" id="desc">Загрузка...</div>
    
    <div class="details">
        <div>Ветер <span class="val" id="wind">-- м/с</span></div>
        <div>УФ-индекс <span class="val" id="uv">--</span></div>
        <div>Мин / Макс <span class="val" id="range">-- / --</span></div>
        <div>Осадки <span class="val" id="rain">--%</span></div>
    </div>
</div>

<script>
    async function getWeatherData() {
        // Координаты (здесь Москва, можно поменять на свои)
        const lat = 55.75;
        const lon = 37.62;

        try {
            // Используем Open-Meteo (API без ключа)
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto`;
            
            const response = await fetch(url);
            const data = await response.json();

            // 1. Температура и ветер
            document.getElementById('temp').innerText = Math.round(data.current.temperature_2m) + "°C";
            document.getElementById('wind').innerText = data.current.wind_speed_10m + " м/с";
            
            // 2. УФ-индекс (берем максимальный на сегодня)
            const uv = data.daily.uv_index_max[0];
            let uvStatus = uv;
            if (uv <= 2) uvStatus += " (Низ)";
            else if (uv <= 5) uvStatus += " (Сред)";
            else uvStatus += " (Выс)";
            document.getElementById('uv').innerText = uvStatus;

            // 3. Мин/Макс за день
            const min = Math.round(data.daily.temperature_2m_min[0]);
            const max = Math.round(data.daily.temperature_2m_max[0]);
            document.getElementById('range').innerText = `${min}° / ${max}°`;

            // 4. Осадки
            document.getElementById('rain').innerText = data.current.precipitation + " мм";

            // 5. Описание погоды по коду (WMO)
            const code = data.current.weather_code;
            const weatherDesc = {
                0: "Ясно", 1: "Преимущ. ясно", 2: "Переменная облачность", 3: "Пасмурно",
                45: "Туман", 61: "Небольшой дождь", 71: "Снег", 95: "Гроза"
            };
            document.getElementById('desc').innerText = weatherDesc[code] || "Облачно";

        } catch (error) {
            document.getElementById('desc').innerText = "Ошибка загрузки";
        }
    }

    getWeatherData();
</script>

</body>
</html>
