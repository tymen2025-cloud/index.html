<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #1e3c72;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        input {
            width: 70%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: none;
        }
        button {
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #4facfe;
            color: white;
            cursor: pointer;
        }
        .temp { font-size: 50px; margin: 20px 0; }
        .details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <input type="text" id="cityInput" placeholder="Введите город...">
    <button onclick="searchWeather()">🔍</button>
    
    <h2 id="cityName">Город</h2>
    <div class="temp" id="temp">--°C</div>
    <div id="desc">Введите город и нажмите поиск</div>
    
    <hr>
    <div class="details">
        <div>Ветер: <span id="wind">--</span> м/с</div>
        <div>УФ-индекс: <span id="uv">--</span></div>
    </div>
</div>

<script>
    async function searchWeather() {
        const city = document.getElementById('cityInput').value;
        const descBox = document.getElementById('desc');
        if (!city) return;

        descBox.innerText = "Ищу...";

        try {
            // 1. Получаем координаты города через Геокодинг (бесплатно)
            const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=ru&format=json`;
            const geoRes = await fetch(geoUrl);
            const geoData = await geoRes.json();

            if (!geoData.results) {
                descBox.innerText = "Город не найден";
                return;
            }

            const { latitude, longitude, name } = geoData.results[0];
            document.getElementById('cityName').innerText = name;

            // 2. Получаем погоду по координатам
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m&daily=uv_index_max&timezone=auto`;
            const weatherRes = await fetch(weatherUrl);
            const weatherData = await weatherRes.json();

            // Вывод данных
            document.getElementById('temp').innerText = Math.round(weatherData.current.temperature_2m) + "°C";
            document.getElementById('wind').innerText = weatherData.current.wind_speed_10m;
            document.getElementById('uv').innerText = weatherData.daily.uv_index_max[0];
            descBox.innerText = "Данные обновлены";

        } catch (e) {
            descBox.innerText = "Ошибка сети";
        }
    }
</script>
</body>
</html>
