<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Погода</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        h1 { margin: 10px 0; font-size: 24px; }
        .temp { font-size: 48px; font-weight: bold; margin: 10px 0; }
        .info { font-size: 16px; margin: 5px 0; opacity: 0.9; }
        .uv-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="card">
    <h1 id="city-name">Загрузка...</h1>
    <div class="temp" id="temp">--°C</div>
    <div class="info" id="description">Описание погоды</div>
    <div class="info" id="wind">Ветер: -- м/с</div>
    
    <div class="uv-box">
        <div class="info">Прогноз: <span id="forecast">...</span></div>
        <div class="info">УФ-индекс: <span id="uv-index">...</span></div>
    </div>
</div>

<script>
    // === НАСТРОЙКИ ===
    const apiKey = 'ВСТАВЬ_СВОЙ_КЛЮЧ_ЗДЕСЬ'; // Твой API ключ от OpenWeather
    const city = 'Москва'; // Можно поменять на свой город

    async function getWeather() {
        try {
            // 1. Получаем основные данные и координаты
            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=ru`);
            const data = await response.json();

            if (data.cod !== 200) {
                document.getElementById('city-name').innerText = "Город не найден";
                return;
            }

            // Заполняем основные поля
            document.getElementById('city-name').innerText = data.name;
            document.getElementById('temp').innerText = Math.round(data.main.temp) + "°C";
            document.getElementById('description').innerText = data.weather[0].description;
            
            // Скорость ветра (в OpenWeather при units=metric она уже в м/с)
            document.getElementById('wind').innerText = `Ветер: ${data.wind.speed.toFixed(1)} м/с`;
            
            // Прогноз (описание)
            document.getElementById('forecast').innerText = data.weather[0].main;

            // 2. Получаем УФ-индекс по координатам
            const lat = data.coord.lat;
            const lon = data.coord.lon;
            const uvResponse = await fetch(`https://api.openweathermap.org/data/2.5/uvi?lat=${lat}&lon=${lon}&appid=${apiKey}`);
            const uvData = await uvResponse.json();
            
            const uv = uvData.value;
            let uvText = uv;

            if (uv <= 2) uvText += " (Низкий)";
            else if (uv <= 5) uvText += " (Умеренный)";
            else if (uv <= 7) uvText += " (Высокий)";
            else uvText += " (Опасно)";

            document.getElementById('uv-index').innerText = uvText;

        } catch (error) {
            console.error("Ошибка:", error);
            document.getElementById('city-name').innerText = "Ошибка сети";
        }
    }

    getWeather();
</script>

</body>
</html>
